# Punctual trigger for the daily digest.
#
# Vercel Hobby cron precision is per-hour (±59 min), and GitHub's own scheduler
# routinely dispatches 30-60 minutes late, so no single scheduled shot can be
# trusted to land just after a workspace's configured push hour. Instead of
# betting on one punctual dispatch, the job loops: call the endpoint, and if
# every workspace reports not_due, sleep to just past the next top of the hour
# and call again, until real work happens or the job times out. Whichever
# dispatch wakes up first stands guard at the gate. The endpoint is fully
# idempotent (digest lock, skipped_done, single Feishu push), so overlapping
# runs and extra calls are harmless no-ops, and the Vercel crons stay as a
# fallback.
#
# Required repository secret: CRON_SECRET — the same value as the Vercel env var.
# Required repository variable: APP_URL — your own deployment's origin. There is
# deliberately no default. A default is one particular deployment's address
# living in every copy of this file, and a fork that never sets the variable
# would quietly send its hourly traffic there instead of failing.
name: digest-trigger

on:
  schedule:
    # Beijing 13:00 (the default push hour) is 05:00 UTC — the hour that matters
    # most gets three staggered dispatch points (Beijing 11:50, 12:20, 12:50),
    # so even with heavy dispatch delay at least one run is alive and waiting
    # when the gate opens.
    #
    # The gate sits at 13:00 rather than the morning because arXiv rebuilds its
    # RSS once a day at 04:00 UTC (12:00 Beijing). A run before that reads the
    # PREVIOUS day's build, which on a Monday is the weekend's — and the feed
    # declares <skipDays>Saturday, Sunday</skipDays>, so it holds nothing.
    # Waiting for the rebuild also stops Friday's build being dropped entirely:
    # Friday's own run had already completed from Thursday's build, and by
    # Monday the feed has moved on.
    #
    # A dispatch point must stay under the job's timeout away from the gate: a
    # run that starts more than that early is killed while still waiting, which
    # is a red failure every day rather than a missed push.
    - cron: "50 3 * * 1-5"
    - cron: "20 4 * * 1-5"
    # Hourly coverage for workspaces with later push hours. Capped at 14:50 UTC
    # (22:50 Beijing) so the last run of Friday cannot drift past UTC midnight
    # and wait around into the weekend.
    #
    # It starts at 04:50 UTC rather than earlier for the reason above: a
    # workspace configured before ~12:00 Beijing is served from 11:50 onwards
    # instead of at its own hour, because a dispatch early enough to catch that
    # hour cannot survive the wait when no other workspace is due either. Such
    # a workspace would be reading the previous day's feed regardless.
    - cron: "50 4-14 * * 1-5"
  workflow_dispatch:

permissions: {}

# A run that is asleep waiting for the gate makes any newly dispatched run
# redundant; queue at most one behind it instead of stacking waiters.
concurrency:
  group: digest-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    # The earliest dispatch point (11:50 Beijing) waits ~70 minutes for a 13:00
    # gate, so this needs real margin above that: a run killed mid-wait is a red
    # failure every day, not a missed push, and the whole design here is that a
    # waiting run holds out until the gate opens.
    timeout-minutes: 90
    steps:
      - name: Call the digest endpoint until it is due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -u
          # Fail here rather than further down: an unset variable would make
          # every request go to "/api/cron/daily-digest" with no origin, and
          # curl's error for that reads nothing like "you skipped a setup step".
          if [ -z "${APP_URL:-}" ]; then
            echo "Set the APP_URL repository variable to your deployment's origin," >&2
            echo "e.g. https://your-app.vercel.app — see this workflow's header." >&2
            exit 1
          fi

          while true; do
            # Weekday gate in Beijing time: a Friday-evening dispatch that
            # drifts past UTC midnight must not stand guard and start a
            # Saturday digest.
            if [ "$(TZ=Asia/Shanghai date +%u)" -gt 5 ]; then
              echo "weekend in Beijing, nothing to trigger"
              exit 0
            fi

            code="000"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                --max-time 300 "${APP_URL%/}/api/cron/daily-digest" || echo "000")
              echo "$(date -u +%H:%M:%S) attempt $attempt: HTTP $code"
              head -c 500 /tmp/resp.json || true; echo
              [ "$code" = "200" ] && break
              sleep 60
            done
            if [ "$code" != "200" ]; then
              echo "digest trigger failed after 5 attempts" >&2
              exit 1
            fi

            # Done as soon as any workspace did real work (or none exist at
            # all); all-not_due means the gate has not opened yet.
            if jq -e '[.results[].status] | length == 0 or any(. != "not_due")' /tmp/resp.json >/dev/null; then
              exit 0
            fi

            # Sleep to 20s past the next top of the hour (headroom for clock
            # skew) and try again; the job timeout caps how long this goes on.
            now=$(date -u +%s)
            sleep $(( 3600 - now % 3600 + 20 ))
          done
